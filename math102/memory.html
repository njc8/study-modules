<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcards · MATH 102</title>
<link rel="stylesheet" href="../assets/study.css">
<script src="../assets/study.js"></script>
<script src="../assets/calc102.js"></script>
<script src="../assets/m102-deck.js"></script>
<script src="../assets/mathjax-tex-svg.js"></script>
<style>
.fc-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted);margin-bottom:10px}
.fc-card{min-height:260px;display:flex;flex-direction:column}
.fc-prompt{font-size:22px;line-height:1.6;margin:6px 0 18px}
.fc-answer{border-top:1px solid var(--line);padding-top:16px;margin-top:auto}
.fc-show{font-size:20px;line-height:1.6}
.fc-why{font-size:15px;color:var(--muted);margin-top:8px;line-height:1.6}
.fc-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}
.fc-bar .btn kbd{margin-left:8px;opacity:.7}
.fc-bar .spacer{flex:1}
.fc-done .result{margin-top:4px}
.fc-list{margin:10px 0 0;padding-left:20px}
.fc-list li{margin:6px 0}
.fc-nav a.pick .n{font-size:10px}
</style>
</head>
<body>
<div class="app">
<nav class="side" id="nav"></nav>
<main>
<section data-id="deck" data-title="Flashcards" class="active">
  <p class="eyebrow" id="eyebrow">Flashcards</p>
  <h2 id="title">Pick a unit</h2>
  <p class="lead">Read the card, write the answer in your notebook, then flip. Be honest when you mark it. Nothing is typed here.</p>
  <div class="card" id="box"></div>
  <p class="hint">Keys: <kbd>Space</kbd> or <kbd>Enter</kbd> flips, then <kbd>1</kbd> got it, <kbd>2</kbd> missed it. Missed cards are remembered in this browser so you can redo just those.</p>
</section>
</main>
</div>
<script>
const MODS=window.MEM_MODULES||[],CARDS=window.MEM_CARDS||[];
const KEY='m102-flash-missed';
let missed={};try{missed=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){}
const saveMissed=()=>{try{localStorage.setItem(KEY,JSON.stringify(missed));}catch(e){}};
const missedOf=mod=>CARDS.filter(c=>c.mod===mod&&missed[c.id]);
let mod=null,queue=[],i=0,flipped=false,got=0,miss=[],mode='all';

function buildNav(){
  const nav=$('#nav');
  nav.innerHTML=`<a class="hub" href="index.html">◀ MATH 102 modules</a><h1>Flashcards</h1><p class="sub">${CARDS.length} cards, by unit</p><div id="navlinks"></div>`;
  const box=$('#navlinks');
  MODS.forEach(m=>{const n=CARDS.filter(c=>c.mod===m.key).length;const k=missedOf(m.key).length;
    const a=el('a',{href:'#mod='+m.key,class:'pick'+(m.key===mod?' active':'')});a.innerHTML=`<span class="n">${n}</span><span>${m.title.replace(/^Module \d+ · /,'')}${k?` <span class="muted">(${k} missed)</span>`:''}</span>`;box.appendChild(a);});
}
function start(key,which='all'){
  mod=key;mode=which;const m=MODS.find(x=>x.key===key);if(!m)return home();
  const src=which==='missed'?missedOf(key):CARDS.filter(c=>c.mod===key);
  queue=shuffle(src);i=0;got=0;miss=[];flipped=false;
  $('#eyebrow').textContent=m.title;$('#title').textContent=which==='missed'?'Redo the missed cards':'Flashcards';
  buildNav();show();
}
function home(){
  mod=null;$('#eyebrow').textContent='Flashcards';$('#title').textContent='Pick a unit';buildNav();
  $('#box').innerHTML=`<p>Choose a unit in the sidebar. Each unit's cards are the facts its module expects you to know cold: antiderivatives, identities, formulas, test statements.</p>
    <div class="controls">${MODS.map(m=>`<a class="btn small" href="#mod=${m.key}">${m.title.replace(/^Module \d+ · /,'')}</a>`).join('')}</div>`;
}
function show(){
  const box=$('#box');
  if(i>=queue.length)return finish();
  const c=queue[i];flipped=false;
  box.innerHTML=`<div class="fc-top"><span>${i+1} of ${queue.length}</span><span>${got} right · ${miss.length} missed</span></div>
    <div class="fc-card"><div class="fc-prompt">${c.prompt}</div>
      <div class="fc-answer" id="ans" hidden><div class="fc-show">${c.show}</div>${c.why?`<div class="fc-why">${c.why}</div>`:''}</div>
      <div class="fc-bar" id="bar"><button class="btn primary" id="flip">Flip <kbd>Space</kbd></button><span class="spacer"></span><button class="btn small" id="skip">Skip</button></div>
    </div>`;
  $('#flip').onclick=flip;$('#skip').onclick=()=>{i++;show();};
  typeset(box);
}
function flip(){
  if(flipped)return;flipped=true;$('#ans').hidden=false;
  $('#bar').innerHTML=`<button class="btn primary" id="yes">Got it <kbd>1</kbd></button><button class="btn" id="no">Missed it <kbd>2</kbd></button>`;
  $('#yes').onclick=()=>mark(true);$('#no').onclick=()=>mark(false);
}
function mark(ok){
  const c=queue[i];
  if(ok){got++;delete missed[c.id];}else{miss.push(c);missed[c.id]=true;}
  saveMissed();buildNav();i++;show();
}
function finish(){
  const box=$('#box');const k=missedOf(mod).length;
  box.innerHTML=`<div class="fc-done"><div class="result">${got} of ${queue.length} right</div>
    ${miss.length?`<p>Missed this round:</p><ul class="fc-list">${miss.map(c=>`<li>${c.prompt}</li>`).join('')}</ul>`:'<p>Clean sweep.</p>'}
    <div class="controls">${k?`<button class="btn primary" id="redo">Redo the ${k} missed</button>`:''}<button class="btn" id="again">All cards again</button><button class="btn" id="back">Other units</button></div></div>`;
  if(k)$('#redo').onclick=()=>start(mod,'missed');
  $('#again').onclick=()=>start(mod,'all');$('#back').onclick=()=>{location.hash='';home();};
  buildNav();typeset(box);
}
document.addEventListener('keydown',e=>{
  if(!mod||i>=queue.length||e.metaKey||e.ctrlKey)return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!flipped)flip();}
  else if(flipped&&e.key==='1'){e.preventDefault();mark(true);}
  else if(flipped&&e.key==='2'){e.preventDefault();mark(false);}
});
function route(){const m=/mod=([^&]+)/.exec(location.hash);if(m&&MODS.some(x=>x.key===m[1]))start(m[1]);else home();}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
